<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Arial", sans-serif;
      }
      #video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgb(30, 30, 30);
      }
      #message {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        text-align: center;
        justify-content: center;
        font-size: 16px;
        font-weight: bold;
        color: white;
        pointer-events: none;
        padding: 20px;
        box-sizing: border-box;
        text-shadow: 0 0 5px black;
      }
      #notice {
        display: none;
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 8px 14px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        font-size: 14px;
        text-align: center;
        pointer-events: none;
      }
      #lang-icon {
        display: none;
        position: absolute;
        top: 20px;
        right: 20px;
        width: 30px;
        height: 30px;
        background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MCA1MCIgZmlsbD0iI2ZmZiIgeG1sbnM6dj0iaHR0cHM6Ly92ZWN0YS5pby9uYW5vIj48cGF0aCBkPSJNMzguNSAzMy45bC0xLjktMS42YzIuNS0yLjkgMy44LTYuMyAzLjgtOS45IDAtMy4xLTEtNi4xLTIuOS04LjhsMi4xLTEuNWMyLjIgMy4xIDMuNCA2LjYgMy40IDEwLjItLjEgNC4zLTEuNiA4LjMtNC41IDExLjZ6TTUuNiAyMy4yaC0zYy0uNSAwLTEgLjUtMSAxLjF2MTAuNWMwIC42LjQgMS4xIDEgMS4xaDNjLjIgMCAuMyAwIC40LjFsMTMuOCA3LjhjLjYuNCAxLjQtLjIgMS40LTFWMTYuM2MwLS44LS44LTEuMy0xLjQtMUw2LjEgMjMuMWMtLjIuMS0uMy4xLS41LjF6bTIxLTE2LjlMMTIuOCAxNGMtLjEuMS0uMy4xLS40LjFoLTNjLS41IDAtMSAuNS0xIDEuMVYyMGwxMi4yLTYuOGExLjM2IDEuMzYgMCAwIDEgMS41IDBjLjUuMy44LjguOCAxLjV2MTcuOWwzLjcgMi4xYy42LjQgMS40LS4yIDEuNC0xVjcuMmMuMS0uOC0uNy0xLjMtMS40LS45em0xNi41IDMwLjJsLTEuOS0xLjZjMy4xLTMuNyA0LjctOCA0LjctMTIuNSAwLTQtMS4zLTcuOC0zLjctMTEuMmwyLjEtMS41YzIuNyAzLjggNC4yIDguMiA0LjIgMTIuNy0uMiA1LjEtMiA5LjktNS40IDE0LjF6TTM1IDMxLjFsLTItMS42YzEuNy0yLjEgMi42LTQuNiAyLjYtNy4yIDAtMi40LS44LTQuNy0yLjItNi43bDItMS41YzEuOCAyLjUgMi43IDUuMyAyLjcgOC4yIDAgMy4yLTEuMSA2LjItMy4xIDguOHoiLz48L3N2Zz4=");
        background-size: 80%;
        background-position: center;
        background-repeat: no-repeat;
        cursor: pointer;
      }
      #lang-list {
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        background: rgb(190, 190, 190);
        color: black;
      }
      #lang-icon:hover #lang-list {
        display: block;
      }
      #lang-list div {
        border-bottom: 1px solid black;
        padding: 5px 15px;
      }
    </style>
  </head>
  <body>
    <video id="video"></video>
    <div id="message"></div>
    <div id="notice" role="status"></div>
    <div id="lang-icon"><div id="lang-list"></div></div>

    <script defer src="hls.min.js"></script>

    <script>
      const video = document.getElementById("video");
      const message = document.getElementById("message");
      const notice = document.getElementById("notice");
      const langIcon = document.getElementById("lang-icon");
      const langList = document.getElementById("lang-list");

      const retryPause = 2000;
      // a camera whose audio is stamped far from its video never starts with audio
      const audioStartTimeout = 10000;
      const noticePause = 6000;

      let defaultControls = false;

      // With hlsVideoOnly the server leaves audio out unless it is asked for (?audio=1),
      // so the stream with audio is loaded when the viewer turns the sound on.
      let hls = null;
      let withAudio = false;
      let streamHasAudio = false;
      let audioFailed = false;
      let audioTimer = null;
      let retryTimer = null;
      let noticeTimer = null;

      const playlistURL = () => {
        const params = new URLSearchParams(window.location.search);
        if (withAudio) {
          params.set("audio", "1");
        }
        const query = params.toString();
        return "index.m3u8" + (query !== "" ? "?" + query : "");
      };

      const play = () => {
        const res = video.play();
        if (res !== undefined) {
          // the browser refused to start with sound: start muted, the viewer can unmute again
          res.catch(() => {
            if (!video.muted) {
              video.muted = true;
              video.play().catch(() => {});
            }
          });
        }
      };

      const reloadStream = () => {
        clearTimeout(retryTimer);
        clearTimeout(audioTimer);
        if (hls !== null) {
          hls.destroy();
          hls = null;
        }
        loadStream();
      };

      // not setMessage(): that one hides the controls and is cleared when the stream loads
      const showNoSoundNotice = () => {
        clearTimeout(noticeTimer);
        notice.innerText = "This camera's sound cannot be played. Showing video without sound.";
        notice.style.display = "block";
        noticeTimer = setTimeout(() => {
          notice.style.display = "none";
        }, noticePause);
      };

      const giveUpOnAudio = () => {
        withAudio = false;
        audioFailed = true;
        video.muted = true;
        reloadStream();
        showNoSoundNotice();
      };

      const onSoundChange = () => {
        if (video.muted || video.volume === 0 || withAudio || streamHasAudio) {
          return;
        }
        if (audioFailed) {
          showNoSoundNotice();
          return;
        }
        withAudio = true;
        reloadStream();
        audioTimer = setTimeout(giveUpOnAudio, audioStartTimeout);
      };

      const setMessage = (str) => {
        if (str !== "") {
          video.controls = false;
        } else {
          video.controls = defaultControls;
        }
        message.innerText = str;
      };

      const loadStream = () => {
        // Prefer hls.js over native HLS, due to better protocol support.
        if (Hls.isSupported()) {
          hls = new Hls({
            maxLiveSyncPlaybackRate: 1.5,
          });

          hls.on(Hls.Events.ERROR, (evt, data) => {
            if (data.fatal) {
              hls.destroy();
              hls = null;

              langIcon.style.display = "none";
              langList.innerHTML = "";

              if (data.details === "manifestIncompatibleCodecsError") {
                setMessage(
                  "stream makes use of codecs which are not compatible with this browser or operative system",
                );
              } else if (data.response && data.response.code === 404) {
                setMessage("stream not found, retrying in some seconds");
              } else {
                setMessage(data.error + ", retrying in some seconds");
              }

              retryTimer = setTimeout(() => loadStream(), retryPause);
            }
          });

          hls.on(Hls.Events.MEDIA_ATTACHED, () => {
            hls.loadSource(playlistURL());
          });

          hls.on(Hls.Events.MANIFEST_LOADED, () => {
            streamHasAudio = hls.levels.some((level) => !!level.audioCodec);

            if (hls.audioTracks.length > 1) {
              for (const track of hls.audioTracks) {
                const div = document.createElement("DIV");
                div.innerText = track.name;
                div.addEventListener("click", () => {
                  hls.audioTrack = track.id;
                });
                langList.appendChild(div);
              }
              langIcon.style.display = "block";
            }

            setMessage("");
            play();
          });

          // when the video is resumed after a manual or forced pause
          // (i.e. when the window is minimized), restore live streaming.
          video.onplay = () => {
            if (hls !== null && hls.liveSyncPosition) {
              video.currentTime = hls.liveSyncPosition;
            }
          };

          hls.attachMedia(video);
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          // since it's not possible to detect timeout errors in iOS,
          // wait for the playlist to be available before starting the stream
          const url = playlistURL();
          fetch(url).then(() => {
            video.src = url;
            play();
          });
        }
      };

      const parseBoolString = (str, defaultVal) => {
        str = str || "";

        if (["1", "yes", "true"].includes(str.toLowerCase())) {
          return true;
        }
        if (["0", "no", "false"].includes(str.toLowerCase())) {
          return false;
        }
        return defaultVal;
      };

      const loadAttributesFromQuery = () => {
        const params = new URLSearchParams(window.location.search);
        video.controls = parseBoolString(params.get("controls"), true);
        video.muted = parseBoolString(params.get("muted"), true);
        video.autoplay = parseBoolString(params.get("autoplay"), true);
        video.playsInline = parseBoolString(params.get("playsinline"), true);
        video.disablepictureinpicture = parseBoolString(
          params.get("disablepictureinpicture"),
          false,
        );
        defaultControls = video.controls;
        withAudio = !video.muted;
      };

      // use load instead of DOMContentLoaded, otherwise, in Firefox,
      // the page gets stuck in the "loading" state.
      window.addEventListener("load", () => {
        loadAttributesFromQuery();
        video.addEventListener("volumechange", onSoundChange);
        video.addEventListener("playing", () => clearTimeout(audioTimer));
        loadStream();
        if (withAudio) {
          audioTimer = setTimeout(giveUpOnAudio, audioStartTimeout);
        }
      });
    </script>
  </body>
</html>
